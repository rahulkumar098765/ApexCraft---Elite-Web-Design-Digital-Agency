<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="100" fill="#030712"/>
  
  <defs>
    <filter id="bgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="leg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#0284c7" />
      <stop offset="100%" stopColor="#0369a1" />
    </linearGradient>
    <linearGradient id="leg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#67e8f9" />
      <stop offset="40%" stopColor="#0ea5e9" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>
    <linearGradient id="swooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#0284c7" stopOpacity="0.4" />
      <stop offset="40%" stopColor="#00d2ff" />
      <stop offset="100%" stopColor="#7dd3fc" />
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="140" fill="#00d2ff" opacity="0.15" filter="url(#bgGlow)" />

  <g transform="translate(46, 40) scale(3.5)">
    <!-- Back Swoosh -->
    <path d="M 68 38 C 88 40 102 52 98 64 C 95 72 84 78 68 80" stroke="url(#swooshGrad)" stroke-width="5" stroke-linecap="round" opacity="0.8" />
    
    <!-- Left Leg -->
    <path d="M 60 12 L 24 92 L 40 92 L 60 44 Z" fill="url(#leg1)" />
    
    <!-- Right Leg -->
    <path d="M 60 12 L 60 44 L 80 92 L 96 92 Z" fill="url(#leg2)" />
    
    <!-- Inner Cutout -->
    <path d="M 60 46 L 76 86 L 44 86 Z" fill="#030712" opacity="0.95" />
    
    <!-- Front Swoosh -->
    <path d="M 44 82 C 60 76 80 62 82 48 C 84 36 74 30 62 30 C 50 30 42 42 36 54" stroke="url(#swooshGrad)" stroke-width="6.5" stroke-linecap="round" filter="url(#laserGlow)" />
    
    <!-- Swoosh Core Blade -->
    <path d="M 46 80 Q 72 68 80 50 Q 84 38 72 34 Q 56 34 40 58 Q 58 66 74 54" fill="url(#leg2)" opacity="0.95" />
    
    <!-- Apex Dot -->
    <circle cx="60" cy="14" r="2.5" fill="#ffffff" filter="url(#laserGlow)" />
  </g>
</svg>
